# Type-checks, lints, audits and builds every push and pull request.
# Deployment is gated on this workflow succeeding — see deploy.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Validates source metadata, review dates, versions, the legal-safety
      # block, required prompt sections and related-skill references.
      - name: Audit skill registry
        run: npm run audit

      - name: Build
        run: npm run build

      - name: Build skill packs
        run: npm run packs
