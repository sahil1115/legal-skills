# Publishes the site to GitHub Pages.
#
# Triggered by CI completing successfully on main, so a commit that fails
# lint, typecheck, audit or build never reaches production. Can also be run
# by hand from the Actions tab.
#
# Requires Pages to be enabled once: Settings -> Pages -> Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Skip when CI failed. workflow_dispatch has no upstream run, so allow it
    # through explicitly rather than reading a conclusion that is not there.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact commit CI validated, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
