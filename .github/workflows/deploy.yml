# Builds the static bundle and publishes it to GitHub Pages.
#
# This workflow is MANUAL by default, so a repository with Pages switched off
# does not collect a failed run on every push. To go live:
#
#   1. Settings -> Pages -> Source: GitHub Actions
#   2. Either run this workflow once from the Actions tab, or uncomment the
#      `push` trigger below to deploy automatically on every push to main.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
